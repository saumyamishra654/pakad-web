# Split topology: the frontend is hosted separately (Vercel) and Demucs runs on
# a remote GPU (RunPod), so this stack is just the API + nginx. The API binds to
# loopback; only nginx publishes 80/443.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      # Override the host key path with the in-container mount below.
      - FIREBASE_SERVICE_ACCOUNT_KEY=/secrets/firebase.json
    volumes:
      - app-data:/data
      - model-cache:/root/.cache
      - ${FIREBASE_KEY_FILE:?set FIREBASE_KEY_FILE in .env to your service-account json}:/secrets/firebase.json:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app-data:
  model-cache:
